name: Validate K8s Manifests & Scripts

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check shell script syntax
        run: bash -n deploy-staging.sh

      - name: Validate YAML manifest syntax
        run: |
          python3 -c '
          import glob, yaml
          files = sorted(glob.glob("*.yaml"))
          assert files, "No .yaml files found"
          for f in files:
              with open(f) as fh:
                  docs = list(yaml.safe_load_all(fh))
              assert docs and all(d is not None for d in docs), f"Empty/invalid YAML in {f}"
              print(f"OK: {f}")
          '
